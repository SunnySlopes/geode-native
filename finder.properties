# 独立原生母岩查找器，无需Java或Minecraft运行时。
seed=9206294873968313284
minecraft-version=1.21.1
search-center-x=0
search-center-z=0
search-radius-blocks=10000
search-area-shape=circle
scan-threads=8
geode-legacy-random-tick-radius-blocks=128
geode-simulation-distance-chunks=10
# 设为20可复现旧Java的最低晶洞数阈值。
geode-min-geodes=1
geode-min-budding-amethyst=1
# 万格范围可保留全量0；十万范围可试20万预算，降低预算更快但可能漏热点。
geode-prefilter-limit=0
# auto在大范围有限预算下尝试OpenCL GPU；cpu强制CPU粗筛。
geode-scan-backend=auto
geode-result-limit=100

# terrain为原生局部地形修正，stone为旧Java兼容的纯石头估计。
geode-model=terrain
